name: Build

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Release
            label: release
            msvc_arch: x64
            cmake_platform: x64
            arch: x64
            build_dir: build
          - config: Debug
            label: debug
            msvc_arch: x64
            cmake_platform: x64
            arch: x64
            build_dir: build
          - config: Release
            label: release
            msvc_arch: x86
            cmake_platform: Win32
            arch: x86
            build_dir: build/x86
          - config: Debug
            label: debug
            msvc_arch: x86
            cmake_platform: Win32
            arch: x86
            build_dir: build/x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 版本号不再从 git tag 推导：tag 构建会在 Configure 阶段显式传入
          # -DUSBASSISTANT_VERSION_OVERRIDE。完整历史仅用于排查。
          fetch-depth: 0

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Show git state
        shell: bash
        run: git describe --tags --always --dirty --match "v*" || true

      - name: Configure CMake
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
        run: |
          set -o pipefail
          # 只有 tag 构建才是正式版本；其他触发方式（分支、手动）一律 dev。
          VERSION_ARG=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION_ARG="-DUSBASSISTANT_VERSION_OVERRIDE=${GITHUB_REF_NAME#v}"
          fi
          cmake -S . -B "$BUILD_DIR" -A ${{ matrix.cmake_platform }} \
                -DUSBASSISTANT_BUILD_TESTS=ON $VERSION_ARG | tee configure.log
          # tag 构建必须确认四种组合推导出的版本都与 tag 一致。
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            grep -F "UsbAssistant version: v${GITHUB_REF_NAME#v}" configure.log
          fi

      - name: Build
        run: cmake --build ${{ matrix.build_dir }} --config ${{ matrix.config }}

      - name: Run core tests
        run: ctest --test-dir ${{ matrix.build_dir }} -C ${{ matrix.config }} --output-on-failure

      - name: Verify architecture
        shell: bash
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
          CONFIG: ${{ matrix.config }}
          ARCH: ${{ matrix.arch }}
        run: |
          # 注意：dumpbin 的选项必须写成 -nologo/-headers。
          # 在 Git Bash 里以 / 开头的参数会被 MSYS 当作路径改写，
          # dumpbin 会因此返回 157（已在本机 Git Bash 复现）。
          if ! command -v dumpbin >/dev/null 2>&1; then
            echo "::error::architecture check: dumpbin not found in PATH"
            exit 1
          fi
          echo "dumpbin: $(command -v dumpbin)"
          if [[ "$ARCH" == "x86" ]]; then
            expected="machine (x86)"
          else
            expected="machine (x64)"
          fi
          for name in UsbAssistant.exe UsbAssistantUpdater.exe; do
            exe="$BUILD_DIR/$CONFIG/$name"
            if [[ ! -f "$exe" ]]; then
              echo "::error::architecture check: executable not found: $exe"
              exit 2
            fi
            echo "checking: $exe ($(stat -c %s "$exe") bytes)"
            headers="$(dumpbin -nologo -headers "$exe")" || {
              status=$?
              echo "::error::architecture check: dumpbin failed (exit $status) on $name"
              exit 3
            }
            echo "machine lines ($name):"
            printf '%s\n' "$headers" | grep "machine (" || true
            if printf '%s\n' "$headers" | grep -Fq "$expected"; then
              echo "architecture check passed: $name -> $expected"
            else
              echo "::error::architecture check: expected '$expected' for $name"
              exit 4
            fi
          done

      - name: Package release asset
        shell: pwsh
        env:
          BUILD_DIR: ${{ matrix.build_dir }}
          CONFIG: ${{ matrix.config }}
          ARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
        run: |
          # 产物命名与构建版本保持一致：tag 构建用 tag，其余一律 dev。
          if ("${{ github.ref_type }}" -eq "tag") {
            $ref = "${{ github.ref_name }}".Replace('/', '-')
          } else {
            $ref = "dev"
          }
          $stage = "stage/$ref-$env:LABEL-$env:ARCH"
          Remove-Item -Recurse -Force "stage" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$env:BUILD_DIR/$env:CONFIG/UsbAssistant.exe" $stage
          Copy-Item "$env:BUILD_DIR/$env:CONFIG/UsbAssistantUpdater.exe" $stage

          New-Item -ItemType Directory -Force "dist" | Out-Null
          $zip = "dist/UsbAssistant-$ref-$env:LABEL-$env:ARCH.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force

          # zip 根目录必须直接是两个 exe，不带任何后缀。
          Expand-Archive -Path $zip -DestinationPath "stage/verify" -Force
          $names = (Get-ChildItem "stage/verify" -File | Select-Object -ExpandProperty Name | Sort-Object) -join ','
          Write-Host "zip contents: $names"
          if ($names -ne 'UsbAssistant.exe,UsbAssistantUpdater.exe') {
            throw "unexpected zip contents: $names"
          }
          Write-Host "packaged: $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsbAssistant-${{ matrix.label }}-${{ matrix.arch }}
          path: dist/UsbAssistant-*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 生成 release 说明需要完整的 tag 与提交历史。
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        shell: pwsh
        run: |
          python .github/scripts/release_notes.py `
            --tag "${{ github.ref_name }}" `
            --output release_notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist/UsbAssistant-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
