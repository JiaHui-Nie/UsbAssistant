name: Build

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - config: Release
            label: release
            msvc_arch: x64
            cmake_platform: x64
            arch: x64
          - config: Debug
            label: debug
            msvc_arch: x64
            cmake_platform: x64
            arch: x64
          - config: Release
            label: release
            msvc_arch: x86
            cmake_platform: Win32
            arch: x86
          - config: Debug
            label: debug
            msvc_arch: x86
            cmake_platform: Win32
            arch: x86

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 需要完整 tag 历史：CMake 用 git describe 推导版本，
          # tag 构建得到正式版本号，分支构建自动标记为开发版本。
          fetch-depth: 0

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Show version source
        shell: bash
        run: git describe --tags --always --dirty --match "v*"

      - name: Configure CMake
        shell: bash
        env:
          BUILD_DIR: build/${{ matrix.config }}-${{ matrix.arch }}
        run: |
          set -o pipefail
          cmake -S . -B "$BUILD_DIR" -A ${{ matrix.cmake_platform }} \
                -DUSBASSISTANT_BUILD_TESTS=ON | tee configure.log
          # tag 构建必须确认四种组合推导出的版本都与 tag 一致。
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            grep -F "UsbAssistant version: v${GITHUB_REF_NAME#v}" configure.log
          fi

      - name: Build
        run: cmake --build build/${{ matrix.config }}-${{ matrix.arch }} --config ${{ matrix.config }}

      - name: Run core tests
        run: ctest --test-dir build/${{ matrix.config }}-${{ matrix.arch }} -C ${{ matrix.config }} --output-on-failure

      - name: Verify architecture
        shell: bash
        env:
          BUILD_DIR: build/${{ matrix.config }}-${{ matrix.arch }}
          CONFIG: ${{ matrix.config }}
          ARCH: ${{ matrix.arch }}
        run: |
          # 注意：dumpbin 的选项必须写成 -nologo/-headers。
          # 在 Git Bash 里以 / 开头的参数会被 MSYS 当作路径改写，
          # dumpbin 会因此返回 157（已在本机 Git Bash 复现）。
          exe="$BUILD_DIR/bin/$CONFIG/UsbAssistant.exe"
          if ! command -v dumpbin >/dev/null 2>&1; then
            echo "::error::architecture check: dumpbin not found in PATH"
            exit 1
          fi
          echo "dumpbin: $(command -v dumpbin)"
          if [[ ! -f "$exe" ]]; then
            echo "::error::architecture check: executable not found: $exe"
            exit 2
          fi
          echo "checking: $exe ($(stat -c %s "$exe") bytes)"
          headers="$(dumpbin -nologo -headers "$exe")" || {
            status=$?
            echo "::error::architecture check: dumpbin failed (exit $status)"
            exit 3
          }
          echo "machine lines:"
          printf '%s\n' "$headers" | grep "machine (" || true
          if [[ "$ARCH" == "x86" ]]; then
            expected="machine (x86)"
          else
            expected="machine (x64)"
          fi
          if printf '%s\n' "$headers" | grep -Fq "$expected"; then
            echo "architecture check passed: $ARCH -> $expected"
          else
            echo "::error::architecture check: expected '$expected' for $ARCH"
            exit 4
          fi

      - name: Name release asset
        shell: bash
        env:
          BUILD_DIR: build/${{ matrix.config }}-${{ matrix.arch }}
          CONFIG: ${{ matrix.config }}
          ARCH: ${{ matrix.arch }}
          LABEL: ${{ matrix.label }}
        run: |
          ref="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          cp "$BUILD_DIR/bin/$CONFIG/UsbAssistant.exe" \
             "dist/UsbAssistant-${ref}-${LABEL}-${ARCH}.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsbAssistant-${{ matrix.label }}-${{ matrix.arch }}
          path: dist/UsbAssistant-*.exe
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/UsbAssistant-*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
